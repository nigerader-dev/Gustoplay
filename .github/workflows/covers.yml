name: GustoPlay — обложки

# Резолвит официальные арты каталога через Steam Store API и коммитит результат
# в ветку (батч = коммит). В песочнице разработки нет доступа к Steam, поэтому
# шаг вынесен в Actions. Источники артов — только официальные магазины; игры вне
# Steam вписываются руками в tools/steam-overrides.json.
#
# Триггеры:
#   • правка tools/steam-overrides.json или part-файлов каталога (новые игры);
#   • ручной запуск: Actions → «GustoPlay — обложки» → Run workflow.
# Повторные прогоны идемпотентны: уже сопоставленные игры пропускаются без сети.

on:
  workflow_dispatch:
    inputs:
      part:
        description: 'Батч каталога: a..i или all'
        required: false
        default: 'all'
  push:
    branches:
      - arena/01a0d952-gustoplay
      - main
    paths:
      - 'tools/steam-overrides.json'
      - 'tools/resolve-steam-covers.mjs'
      - 'js/catalog/part-*.js'
      - '.github/workflows/covers.yml'

concurrency:
  group: gustoplay-covers
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  resolve:
    name: Резолвинг обложек
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # полная история и реальная ветка: коммитим результат прямо в неё
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Резолвинг официальных артов
        run: node tools/resolve-steam-covers.mjs --part=${{ inputs.part || 'all' }}

      - name: Диагностика прав токена
        env:
          TOKEN: ${{ github.token }}
        run: |
          perms=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(JSON.stringify(j.permissions||j.message))}catch(e){console.log("parse-error")}})')
          echo "::notice::token-permissions: $perms"
          echo "HEAD=$(git rev-parse HEAD) BRANCH=${GITHUB_REF_NAME}"

      - name: Коммит результата
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "gustoplay-bot"
          git config user.email "gustoplay-bot@users.noreply.github.com"
          git add js/catalog/steam-covers.js tools/cover-review.log
          if git diff --cached --quiet; then
            echo "::notice::covers-commit: изменений нет — обложки уже сопоставлены"
            exit 0
          fi
          if ! git commit -m "chore(covers): официальные арты каталога (авто-резолвер)" > /tmp/commit.log 2>&1; then
            echo "::error::covers-commit: git commit упал: $(head -c 400 /tmp/commit.log)"
            exit 1
          fi
          echo "::notice::covers-commit: создан $(git rev-parse --short HEAD)"
          if ! git push origin "HEAD:refs/heads/${BRANCH}" > /tmp/push.log 2>&1; then
            while IFS= read -r line; do echo "::error::covers-push: $line"; done < <(tail -6 /tmp/push.log)
            exit 1
          fi
          echo "::notice::covers-commit: запушено в ${BRANCH}"

      - name: Отчёт по сомнительным совпадениям
        if: always()
        run: |
          {
            echo "### Обложки: отчёт резолвера"
            echo '```'
            cat tools/cover-review.log 2>/dev/null || echo "(лога нет)"
            echo '```'
            echo "Сопоставлено: $(grep -c 'steamId' js/catalog/steam-covers.js || true) записей"
          } >> "$GITHUB_STEP_SUMMARY"
          # список нерешённых игр (MISS/ERROR) дублируем аннотациями — виден через API
          grep -E '^(MISS|ERROR)' tools/cover-review.log | while IFS= read -r line; do
            echo "::notice::cover-review: $line"
          done
          echo "::notice::cover-review: CHECK-совпадений: $(grep -c '^CHECK' tools/cover-review.log || true), всего записей: $(grep -c 'steamId' js/catalog/steam-covers.js || true)"

      - name: Лог резолвера (артефакт)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-review
          path: |
            tools/cover-review.log
            js/catalog/steam-covers.js
          if-no-files-found: ignore
