name: GustoPlay — требования к ПК

# Тянет минимальные и рекомендуемые требования к ПК из Steam Store API и коммитит
# js/catalog/sysreq.js в ветку. В песочнице разработки сети к Steam нет (ответ 000),
# поэтому шаг живёт в Actions — так же, как резолвер обложек (covers.yml).
#
# Формат запроса: строго по одному appid за раз. Steam отвечает HTTP 400 на запрос
# сразу нескольких appid — первый прогон 26.09.2026 собрал 0 игр именно поэтому
# (батчи по 20 → «батч N не получен: HTTP 400»). Разбор ошибок того прогона и
# исправленный сборщик проверяются локально: npm run test:sysreq (заглушка магазина).
#
# Ключ ответа: магазин отвечает объектом, ключ которого не всегда равен запрошенному
# appid (26.09.2026: appids=548430 → {"4207930":{…,"steam_appid":548430,…}}). Прогон 6
# из-за этого записал 12 игр в «нет данных», хотя карточки с требованиями пришли.
# Сборщик теперь ищет карточку и по ключу, и по steam_appid внутри ответа.
#
# Фильтр pc_requirements больше не используется: магазин отдаёт по нему успешный
# ответ с пустым data (проверено на 550 и 620; в прогоне 6 первый проход на фильтре
# собрал 0 игр из 401, потратив 802 запроса).
#
# Проходы (--passes=3). Первый проход — по одной обычной карточке на язык, без
# витрины (быстро, из кэша). Повторные проходы берут недостающие игры медленнее и
# с явной витриной cc: так магазин отвечает по возрастным играм и отпускает
# троттлинг (прогон 3: 293 игры из 401 отвечали success: true, data: []).
# Данные сохраняются после каждого прохода, третий запускается только если
# второй добавил игры.
#
# Триггеры:
#   • правка инструмента, формата или оверрайдов требований;
#   • ручной запуск: Actions → «GustoPlay — требования к ПК» → Run workflow
#     (режим probe — диагностика одного запроса, ничего не пишет в файл).
#
# Данные доставляются двумя путями: коммитом (если токен может писать в ветку)
# и аннотациями прогона — их забирает tools/collect-sysreq-data.mjs.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe — диагностика одного запроса, full — все игры каталога'
        required: false
        default: 'full'
  push:
    branches:
      - arena/01a0e3da-gustoplay
      - main
    paths:
      - 'tools/pull-system-requirements.mjs'
      - 'tools/sysreq-format.mjs'
      - 'tools/sysreq-overrides.json'
      - 'js/catalog/part-*.js'
      # steamId берутся из steam-covers.js: когда обложечный резолвер добавляет
      # новые игры, требования к ПК должны пересобраться (иначе прогон идёт
      # «впустую» — как 28.09.2026 на a7b6c6d, где sysreq не увидел 48 новых)
      - 'js/catalog/steam-covers.js'
      - '.github/workflows/sysreq.yml'

concurrency:
  # Новый прогон отменяет предыдущий: сборщик идемпотентен (данные сливаются с
  # уже стоящими в файле), а очередь из устаревших прогонов занимала час и мешала
  # проверять свежие правки.
  group: gustoplay-sysreq
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  resolve:
    name: Требования к ПК
    runs-on: ubuntu-latest
    # Три прохода по 401 × 2 страницы, 4 потока в первом проходе, таймаут
    # запроса 12 с. Первый проход — обычные карточки без витрины, повторные —
    # с витриной cc и большей паузой. Данные сохраняются после каждого прохода,
    # поэтому даже обрыв по таймауту оставляет собранное в ветке.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # полная история и реальная ветка: коммитим результат прямо в неё
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Сбор требований из Steam Store API
        run: |
          if [ "${{ inputs.mode || 'full' }}" = "probe" ]; then
            node tools/pull-system-requirements.mjs --probe
          else
            node tools/pull-system-requirements.mjs --delay=150 --concurrency=4 --passes=3 --timeout=12000
          fi

      - name: Диагностика прав токена
        env:
          TOKEN: ${{ github.token }}
        run: |
          perms=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(JSON.stringify(j.permissions||j.message))}catch(e){console.log("parse-error")}})')
          echo "::notice::token-permissions: $perms"
          echo "HEAD=$(git rev-parse HEAD) BRANCH=${GITHUB_REF_NAME}"

      - name: Коммит результата
        id: commit
        continue-on-error: true
        run: node tools/commit-sysreq.mjs

      # Результат в любом случае уходит аннотациями: пуш в ветку может не пройти
      # fast-forward — если в ветку запушлили коммит, пока шёл 16-минутный сбор.
      # Наблюдено дважды 27.09.2026: covers.yml закоммитил фикс обложки в середине
      # sysreq-прогона 36343690972 (HEAD ушёл в a2a6158), а прогон 36346384046
      # создал коммит b8a1594, но HEAD уже ушёл в bbcfd47. Диагностика прав токена
      # (шаг «Диагностика прав») при этом показывает push:false даже когда пуш
      # работает — она про права репозитория, не про GITHUB_TOKEN; не верить ей.
      # Аннотации GitHub хранит с капом ~10 на шаг: 110 чанков через API не собрать,
      # полный файл — только в артефакте или коммитом самого прогона. Надёжный способ
      # доставки: запушить правку любого пути из triggers и НЕ пушить ~16 минут —
      # тогда пуш прогона пройдёт fast-forward.
      - name: Доставка данных через аннотации
        if: always()
        run: node tools/emit-sysreq-data.mjs tools/sysreq-review.txt

      - name: Сводка прогона
        if: always()
        run: |
          {
            echo "### Требования к ПК: отчёт сборщика"
            echo '```'
            head -60 tools/sysreq-review.txt 2>/dev/null || echo "(отчёта нет)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Лог сборщика (артефакт)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sysreq-review
          path: |
            tools/sysreq-review.txt
            js/catalog/sysreq.js
          if-no-files-found: ignore
