name: GustoPlay — тесты

# Прогоняем все проверки при каждом изменении сайта.
# Секреты не нужны: тесты работают на локальной базе SQLite и в jsdom.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Каталог — корректность записей
        run: npm run check

      - name: Каталог — аудит полноты
        run: npm run audit

      - name: Интерфейс (jsdom)
        run: npm test

      - name: Тексты — орфография и типографика RU/EN
        run: npm run check:text

      - name: Поведение интерфейса (jsdom)
        run: npm run test:functional

      - name: Доступность — структура, подписи, контрасты
        run: npm run test:a11y

      - name: Адаптив — брейкпоинты и регрессы вёрстки (статический разбор CSS)
        run: npm run test:css

      - name: API аккаунтов (реальная база SQLite)
        run: npm run test:api

      - name: Сквозной сценарий сайт → API → база
        run: npm run test:e2e

      - name: Сборка сайта
        run: npm run build

      - name: Проверка собранного сайта
        run: npm run verify:build

      - name: Отчёт о размере сборки
        run: |
          echo "Страниц: $(find dist -name '*.html' | wc -l)"
          echo "Размер: $(du -sh dist | cut -f1)"

      # Финальный контроль качества: у каждой игры есть официальная обложка
      # и каждый её URL отвечает. Идёт последним, чтобы не задерживать
      # ранние шаги (медленные сети не блокируют тесты).
      - name: Обложки — у каждой игры официальный арт, все URL отвечают
        run: npm run check:covers
