name: GustoPlay — тесты

# Прогоняем все проверки при каждом изменении сайта.
# Секреты не нужны: тесты работают на локальной базе SQLite и в jsdom.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Установка зависимостей
        run: npm ci

      # Браузер для test:visual и test:plan. На образе GitHub Actions уже стоит Chrome,
      # поэтому puppeteer ставим без скачивания своей сборки; если Chrome не нашёлся —
      # качаем браузер через сам puppeteer. Дальше в шагах стоит GUSTOPLAY_REQUIRE_BROWSER=1,
      # и пропуск браузерной проверки становится ошибкой, а не зелёным шагом без проверок.
      - name: Браузер для браузерных проверок
        run: |
          PUPPETEER_SKIP_DOWNLOAD=1 npm i --no-save puppeteer
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/chromium ]; then
            npx puppeteer browsers install chrome
          fi

      - name: Каталог — корректность записей
        run: npm run check

      - name: Каталог — аудит полноты
        run: npm run audit

      - name: Интерфейс (jsdom)
        run: npm test

      - name: Тексты — орфография и типографика RU/EN
        run: npm run check:text

      - name: Требования к ПК — сборщик против заглушки магазина (без сети)
        run: npm run test:sysreq

      # Блок «Подходит ли ваш ПК»: сопоставление моделей, разбор требований магазина,
      # вердикт по комплектующим и разметка блока. Без сети и без браузера.
      - name: Подбор ПК — сравнение комплектующих с требованиями
        run: npm run test:pcfit

      - name: Поведение интерфейса (jsdom)
        run: npm run test:functional

      - name: Доступность — структура, подписи, контрасты
        run: npm run test:a11y

      - name: Адаптив — брейкпоинты и регрессы вёрстки (статический разбор CSS)
        run: npm run test:css

      # Сквозная проверка требований пользователя: пул «Компании», скролл, отметки,
      # вёрстка страницы игры, почта поддержки, блок «Подходит ли ваш ПК». Нужен браузер,
      # он ставится шагом выше; если браузера не окажется, шаг упадёт (GUSTOPLAY_REQUIRE_BROWSER),
      # а не станет зелёным без единой проверки.
      - name: Требования заказчика — сквозная проверка в браузере
        run: npm run test:plan
        env:
          GUSTOPLAY_REQUIRE_BROWSER: '1'

      - name: API аккаунтов (реальная база SQLite)
        run: npm run test:api

      - name: Сквозной сценарий сайт → API → база
        run: npm run test:e2e

      - name: Сборка сайта
        run: npm run build

      - name: Проверка собранного сайта
        run: npm run verify:build

      - name: Отчёт о размере сборки
        run: |
          echo "Страниц: $(find dist -name '*.html' | wc -l)"
          echo "Размер: $(du -sh dist | cut -f1)"

      # Финальный контроль качества: у каждой игры есть официальная обложка
      # и каждый её URL отвечает. Идёт последним, чтобы не задерживать
      # ранние шаги (медленные сети не блокируют тесты).
      - name: Обложки — у каждой игры официальный арт, все URL отвечают
        run: npm run check:covers
